<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320"
     viewBox="0 0 1200 320" role="img"
     aria-label="GeminiRoute — public proxy configs, measured hourly, kept only if they reach the Gemini API">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12202c"/>
      <stop offset="100%" stop-color="#0b141c"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI',
           Roboto, 'Helvetica Neue', Arial, sans-serif; }
  </style>

  <rect width="1200" height="320" fill="url(#sky)"/>

  <!-- The funnel, as the mark: five stages, each narrower than the last. -->
  <g transform="translate(700 74)">
    <rect x="0"  y="0"   width="420" height="22" rx="2" fill="#22384a"/>
    <rect x="0"  y="36"  width="229" height="22" rx="2" fill="#22384a"/>
    <rect x="0"  y="72"  width="190" height="22" rx="2" fill="#22384a"/>
    <rect x="0"  y="108" width="89"  height="22" rx="2" fill="#22384a"/>
    <rect x="0"  y="144" width="23"  height="22" rx="2" fill="#5bc08c"/>
    <text x="436" y="16"  fill="#7793a8" font-size="13">collected</text>
    <text x="245" y="52"  fill="#7793a8" font-size="13">unique</text>
    <text x="206" y="88"  fill="#7793a8" font-size="13">plausible</text>
    <text x="105" y="124" fill="#7793a8" font-size="13">reachable</text>
    <text x="39"  y="160" fill="#5bc08c" font-size="13" font-weight="600">verified</text>
  </g>

  <text x="80" y="128" fill="#dce8f0" font-size="46" font-weight="600"
        letter-spacing="-0.5">GeminiRoute</text>
  <text x="80" y="170" fill="#e8a33d" font-size="19">
    Routes to the Gemini API, proved hourly.
  </text>
  <text x="80" y="208" fill="#7793a8" font-size="15">
    Every config is asked, from inside its own tunnel,
  </text>
  <text x="80" y="230" fill="#7793a8" font-size="15">
    where it comes out. Most do not survive that question.
  </text>

  <rect x="80" y="262" width="34" height="3" fill="#e8a33d"/>
</svg>
