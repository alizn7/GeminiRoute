name: Discovery

on:
  schedule:
    # Deliberately not on the hour. GitHub documents that scheduled events are
    # delayed during high load, that the top of every hour is the peak, and
    # that queued runs may be dropped entirely under enough load. Runs here sat
    # 3+ hours waiting for a runner on `0 * * * *`.
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Two runs must never overlap: both would push to gh-pages and one would lose.
# Unlike CI, the in-progress run is not cancelled — let it finish and publish.
concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      # The database is carried between runs as an asset on this release
      # rather than committed: a binary that size, rewritten hourly, bloats
      # the branch and eventually trips GitHub's 100 MB file limit.
      DB_RELEASE_TAG: db-state

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Xray core
        # Pinned: an unpinned "latest" could change the config format under us.
        env:
          XRAY_VERSION: v26.3.27
        run: |
          set -euo pipefail
          # unzip -d only creates one level, and ~/.local does not exist on a
          # fresh runner.
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip"
          unzip -o -q xray.zip xray -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/xray"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/xray" version

      - name: Verify environment
        run: python -m geminiroute.cli doctor

      - name: Restore database from the release
        # The runner is ephemeral; without this, reliability history resets
        # every hour and every node stays at the "unknown" score.
        run: |
          set -euo pipefail
          mkdir -p data
          if gh release view "$DB_RELEASE_TAG" >/dev/null 2>&1; then
            # No `|| true` here on purpose: if the release exists, a failed
            # download is a real error. Continuing would start from an empty
            # database and then overwrite the stored history with it.
            gh release download "$DB_RELEASE_TAG" -p geminiroute.db.gz -D /tmp --clobber
            gunzip -c /tmp/geminiroute.db.gz > data/geminiroute.db
            echo "Restored database ($(stat -c%s data/geminiroute.db) bytes)."
          else
            echo "No $DB_RELEASE_TAG release yet; starting fresh."
          fi

      - name: Run the pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GR_OUTPUT_DIR: dist
          GR_DATABASE_PATH: data/geminiroute.db
          # Spelled out rather than left to defaults: these are the knobs that
          # decide whether the run fits inside timeout-minutes above.
          GR_MAX_GEMINI_CANDIDATES: "1600"
          GR_GEMINI_POOL_SIZE: "20"
          GR_GEMINI_TIMEOUT: "12"
        run: python -m geminiroute.cli run-full-pipeline

      - name: Save database to the release
        # Before publishing, not after: a failure downstream should not cost
        # this run's history.
        run: |
          set -euo pipefail
          gzip -9 -c data/geminiroute.db > /tmp/geminiroute.db.gz
          # Logged every run so the growth trend is visible long before the
          # 2 GB asset limit is anywhere in sight.
          ls -lh data/geminiroute.db /tmp/geminiroute.db.gz
          if ! gh release view "$DB_RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$DB_RELEASE_TAG" \
              --title "Pipeline state" \
              --notes "Internal database used by the discovery workflow. Not a software release." \
              --prerelease
          fi
          gh release upload "$DB_RELEASE_TAG" /tmp/geminiroute.db.gz --clobber

      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git worktree add publish -B gh-pages origin/gh-pages
          else
            git worktree add --detach publish
            git -C publish checkout --orphan gh-pages
            git -C publish rm -rf . >/dev/null 2>&1 || true
          fi

          rm -rf publish/sub publish/api
          cp -r dist/sub dist/api publish/
          # Drops the database left by earlier runs, which is now kept on the
          # release instead.
          rm -rf publish/data

          # Without this, Pages runs the published tree through Jekyll, which
          # silently drops any path starting with _ or . and can fail the
          # deploy on content it does not understand.
          touch publish/.nojekyll
          cp dist/index.html publish/index.html
          # The README embeds this, so it has to reach the published branch.
          cp dist/card.svg publish/card.svg

          cd publish
          git add -A
          # Idempotent: without this the branch collects 8,760 empty commits/year.
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "chore: publish subscriptions $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin gh-pages
          fi

      - name: Upload output as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: subscriptions
          path: dist/
          retention-days: 7